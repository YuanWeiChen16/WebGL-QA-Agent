[project]
name = "webgl-qa-agent"
version = "0.1.0"
description = "AI-driven black-box QA framework for WebGL games: Playwright drives the browser, a vision LLM reads the screen."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # anthropic 1.x is a breaking major release; vision.py is only verified against 0.x.
    "anthropic>=0.113,<1.0",  # vision.py — Anthropic-compatible gateway client (lazy import)
    "jinja2>=3.1",            # perf_report.py — HTML report templating
    "numpy>=1.26",            # perceiver.py — SSIM / pixel-diff / blank-screen
    "pillow>=10.0",           # screenshot decode
    # Pinned to a minor: the downloaded browser build is coupled to the library version,
    # so bumping this requires re-running `playwright install chromium`.
    "playwright~=1.61.0",     # browser.py — browser control + CDP
    "pyyaml>=6.0",            # config.py / knowledge_base.py — YAML layers
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webgl_qa"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
